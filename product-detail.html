  <style>
    /* ── 详情页专用样式 ── */

    /* 详情页筛选栏额外间距 */
    #detailFilterBar {
      margin-bottom: 40px;
    }

    /* ── 款式卡片网格 ── */
    .variant-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .variant-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }
    .variant-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-hl);
      box-shadow: 0 20px 60px rgba(0,0,0,.4), 0 0 0 1px var(--border-hl);
    }
    .variant-img {
      aspect-ratio: 1/1;
      width: 100%;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }
    .variant-img-placeholder {
      aspect-ratio: 1/1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #222 100%);
      font-size: 3rem;
    }
    .variant-body {
      padding: 20px;
    }
    .variant-name {
      font-size: .95rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 6px;
    }
    .variant-temp {
      font-size: .8rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .variant-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 0;
    }
    .variant-spec-tag {
      padding: 3px 8px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: .7rem;
      color: var(--text2);
    }
    .variant-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .variant-price {
      font-size: .82rem;
      color: var(--text2);
    }
    .variant-price strong {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }
    .variant-link {
      font-size: .78rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: gap .3s;
    }
    .variant-link:hover { gap: 8px; }

    @media (max-width: 768px) {
      .variant-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .variant-grid { grid-template-columns: 1fr; }
    }
  </style>

    // ── 工具函数 ──────────────────────────────────────────────────
    function getSeriesFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('series') || 'envelope';
    }

    function renderHero(seriesId) {
      const data = SERIES_DATA[seriesId];
      if (!data) {
        window.location.href = 'products.html';
        return;
      }
      const hero = document.getElementById('detailHero');
      hero.style.background = `linear-gradient(135deg, ${data.bgColor} 0%, #0a0a0a 60%)`;
      document.getElementById('heroContent').innerHTML = `
        <div class="page-hero-eyebrow">${data.emoji} ${data.name}</div>
        <h1 class="page-hero-title">${data.name}<br><span class="hl" style="font-weight:300">${data.slogan}</span></h1>
        <p class="page-hero-desc">${data.desc}</p>
      `;
      document.title = `${data.name} · 峰悦户外`;
    }

        'linear-gradient(135deg, #2a3a3a 0%, #1a2a2a 100%)',
        'linear-gradient(135deg, #3a2a3a 0%, #2a1a2a 100%)',
        'linear-gradient(135deg, #1a2a3a 0%, #0a1a2a 100%)',
        'linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%)',
      ];
      grid.innerHTML = data.variants.map((v, i) => `
        <div class="variant-card fade-in" data-temp="${v.temp}" style="transition-delay: ${i * .05}s">
          <div class="variant-img-placeholder" style="background: ${colors[i % 9]}">
            <span style="font-size:3rem;opacity:.6">${data.emoji}</span>
          </div>
          <div class="variant-body">
            <div class="variant-name">${v.name}</div>
            <div class="variant-temp">🌡️ ${v.temp}</div>
            <div class="variant-specs">
              ${v.specs.map(s => `<span class="variant-spec-tag">${s}</span>`).join('')}
            </div>
            <div class="variant-foot">
              <div class="variant-price"><strong>${v.price}</strong></div>
              <a href="contact.html" class="variant-link">咨询详情 →</a>
            </div>
          </div>
        </div>
      `).join('');

      // 触发动画
      requestAnimationFrame(() => {
        document.querySelectorAll('.variant-card').forEach(el => {
          el.classList.add('visible');
        });
      });
    }

    // ── 系列筛选栏 ────────────────────────────────────────────────
    const detailFilterBar = document.getElementById('detailFilterBar');
    const currentSeries = getSeriesFromURL();

    // 高亮当前系列
    if (detailFilterBar) {
      detailFilterBar.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === currentSeries) {
          btn.classList.add('active');
        }
        btn.addEventListener('click', () => {
          const f = btn.dataset.filter;
          if (f === 'all') {
            window.location.href = 'products.html';
          } else {
            window.location.href = `product-detail.html?series=${f}`;
          }
        });
      });
    }

    // ── 初始化 ────────────────────────────────────────────────────
    renderHero(currentSeries);
    renderVariants(currentSeries);
  </script>
</body>
</html>
