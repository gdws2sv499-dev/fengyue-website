<!DOCTYPE html>
<html lang="zh-CN" dir="ltr" data-title-key="page_title_contact">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 · 峰悦户外</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── 导航 ── -->
  <nav class="nav scrolled" id="nav">
    <a href="index.html" class="nav-logo">
      <img src="logo-small.png" alt="峰悦户外 FENGYUE" class="nav-logo-img">
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_home">首页</a>
      <a href="products.html" data-i18n="nav_products">产品中心</a>
      <a href="about.html" data-i18n="nav_about">关于我们</a>
      <a href="contact.html" class="active" data-i18n="nav_contact">会员登录</a>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="zh" onclick="switchLang('zh')">中</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
      <a href="contact.html" class="nav-cta" data-i18n="nav_cta">立即咨询</a>
    </div>
    <div class="nav-toggle" id="navToggle">
      <span></span><span></span><span></span>
    </div>
  </nav>
  <div class="nav-mobile" id="navMobile">
    <a href="index.html" data-i18n="nav_home">首页</a>
    <a href="products.html" data-i18n="nav_products">产品中心</a>
    <a href="about.html" data-i18n="nav_about">关于我们</a>
    <a href="contact.html" class="active" data-i18n="nav_contact">联系我们</a>
    <div class="lang-switcher lang-switcher-mobile">
      <button class="lang-btn active" data-lang="zh" onclick="switchLang('zh')">中</button>
      <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
    </div>
  </div>

  <!-- ── 页面英雄区 ── -->
  <section class="page-hero">
    <div class="container">
      <div class="page-hero-content">
        <div class="page-hero-eyebrow">会员服务</div>
        <h1 class="page-hero-title"><span>欢迎</span><br><span class="hl">登录账户</span></h1>
        <p class="page-hero-desc">
          登录后享受专属价格、订单跟踪及更多会员权益。
        </p>
      </div>
    </div>
  </section>

  <!-- ── 登录内容 ── -->
  <section class="section">
    <div class="container">
      <div class="login-wrap fade-in">
        <div class="login-card">
          <div class="login-header">
            <div class="login-icon">👤</div>
            <h2>会员登录</h2>
            <p>请输入您的账户信息登录</p>
          </div>
          <form id="loginForm">
            <div class="form-group">
              <label>会员账号 / 邮箱</label>
              <input type="text" placeholder="请输入账号或邮箱" required>
            </div>
            <div class="form-group">
              <label>密码</label>
              <input type="password" placeholder="请输入密码" required>
            </div>
            <div class="login-options">
              <label class="login-remember">
                <input type="checkbox">
                <span>记住登录</span>
              </label>
              <a href="#" class="login-forget">忘记密码？</a>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
              登录
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
            </button>
          </form>
          <div class="login-footer">
            <span>还没有账户？</span>
            <a href="#">立即注册 →</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── 页脚 ── -->
  <footer class="footer">
    <div class="container">
      <!-- 页脚网格：联系方式 | 二维码 -->
      <div class="footer-grid">
        <div class="footer-col">
          <h4 data-i18n="footer_contact_h">联系方式</h4>
          <div class="footer-contact-item">
            <span class="ico">📞</span>
            <span>0086-511-86451188</span>
          </div>
          <div class="footer-contact-item">
            <span class="ico">✉️</span>
            <span>506466936@qq.com</span>
          </div>
          <div class="footer-contact-item">
            <span class="ico">📍</span>
            <span data-i18n="footer_address">江苏省丹阳市运河镇</span>
          </div>
        </div>
        <div class="footer-brand">
          <div class="footer-qr">
            <div class="footer-qr-item">
              <img src="contacts/whatsapp.png" alt="WhatsApp">
              <span>WhatsApp</span>
            </div>
            <div class="footer-qr-item">
              <img src="contacts/wechat.png" alt="微信">
              <span>微信</span>
            </div>
            <div class="footer-qr-item">
              <img src="contacts/contact.png" alt="联系方式">
              <span>联系方式</span>
            </div>
          </div>
        </div>
      </div>
      <!-- 全宽底栏：版权 + 隐私政策 -->
      <div class="footer-bottom">
        <p class="footer-copy" data-i18n="footer_copy">© 2024 江苏峰悦户外用品有限公司 版权所有</p>
        <div class="footer-legal">
          <a href="#" data-i18n="footer_privacy">隐私政策</a>
          <a href="#" data-i18n="footer_terms">服务条款</a>
          <a href="#" data-i18n="footer_icp">苏ICP备XXXXXXXX号</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
